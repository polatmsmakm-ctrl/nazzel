name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:
    inputs:
      skip_selftest:
        description: "Skip the simulator self-test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      PY_SUPPORT_TAG: "3.14-b11"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen >/dev/null
          xcodegen --version

      - name: Fetch Python runtime and download engine
        run: ./scripts/fetch_python.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        if: ${{ !inputs.skip_selftest }}
        run: |
          set +e
          xcodebuild -project Nazzel.xcodeproj -scheme Nazzel -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            build > build-sim.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-sim.log | sort -u | head -80
          exit $status

      - name: Self-test on simulator
        if: ${{ !inputs.skip_selftest }}
        run: ./scripts/selftest.sh build/sim/Build/Products/Debug-iphonesimulator/Nazzel.app

      - name: Screenshots
        if: ${{ !inputs.skip_selftest }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/Nazzel.app
          ./scripts/screens.sh "$APP" "iPhone SE" screens/se
          ./scripts/screens.sh "$APP" "Pro Max" screens/promax
          mkdir -p shots
          for d in se promax; do
            for f in screens/$d/*.png; do [ -f "$f" ] && cp "$f" "shots/$d-$(basename "$f")"; done
            [ -f "screens/$d/screens.log" ] && cp "screens/$d/screens.log" "shots/$d-app-log.txt"
            [ -f "screens/$d/system.log" ] && cp "screens/$d/system.log" "shots/$d-system-log.txt"
          done
          grep -E "warning:" build-sim.log | grep -v "/SourcePackages/\|Python.xcframework" | sort -u > shots/build-warnings.txt || true
          ls shots
          gh release view ci-screens >/dev/null 2>&1 || gh release create ci-screens --prerelease \
            --title "لقطات الاختبار" --notes "لقطات شاشة من محاكي الآيفون، للمراجعة فقط."
          gh release upload ci-screens shots/* --clobber

      - name: Build for iPhone (unsigned)
        run: |
          set +e
          xcodebuild -project Nazzel.xcodeproj -scheme Nazzel -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-device.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-device.log | sort -u | head -80
          exit $status

      - name: Package IPA
        run: ./scripts/package_ipa.sh build/device/Build/Products/Release-iphoneos/Nazzel.app dist/Nazzel.ipa

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build-sim.log
            build-device.log
            selftest.log
            screens/*/screens.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nazzel-ipa
          path: dist/Nazzel.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YTDLP=$(ls python/app_packages | sed -n 's/^yt_dlp-\(.*\)\.dist-info$/\1/p')
          TAG="build-${{ github.run_number }}"
          cat > notes.md <<EOF
          ملف **Nazzel.ipa** جاهز للتثبيت الجانبي (Sideload).

          - محرك التحميل: yt-dlp ${YTDLP}
          - Python ${PY_SUPPORT_TAG%%-*}
          - الكومِت: ${GITHUB_SHA::7}

          رابط ثابت لآخر نسخة دائماً:
          https://github.com/${{ github.repository }}/releases/latest/download/Nazzel.ipa
          EOF
          gh release create "$TAG" dist/Nazzel.ipa --title "نزّل – بناء ${{ github.run_number }}" --notes-file notes.md --latest
